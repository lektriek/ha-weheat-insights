name: Release

# Push a tag like v1.2.0 (made by scripts/release.py) to publish a GitHub
# release. HACS and the Home Assistant Marketplace show release names as
# versions and the release body as its notes; without releases they show
# commit hashes. Kept identical in ha-weheat-control and ha-weheat-insights.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the manifest version
        run: |
          version=$(python3 -c "import glob, json; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 scripts/release.py --notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.3.0-beta.1) becomes a pre-release, which
          # HACS only offers when "Show beta versions" is switched on.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            $prerelease
